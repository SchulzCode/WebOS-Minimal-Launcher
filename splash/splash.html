<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
	font-family: 'Inter Variable';
	font-weight: 100 900;
	src: url(../app/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2-variations');
}
:root {
	--bg: #07080c;
	--text: #f3f5f9;
	--faint: rgba(243, 245, 249, 0.42);
	--accent: #a99bff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: 'Inter Variable', sans-serif; color: var(--text); position: relative; }

/* aurora: brand colour bottom-left, launcher accent top-right, both heavily blurred */
.glow { position: absolute; border-radius: 50%; filter: blur(140px); }
.g1 { width: 1300px; height: 900px; left: -260px; top: 420px; background: var(--brand); opacity: .34; }
.g2 { width: 1100px; height: 760px; right: -240px; top: -300px; background: var(--brand2); opacity: .26; }
.g3 { width: 700px; height: 700px; left: 610px; top: 190px; background: var(--brand); opacity: .14; filter: blur(170px); }

/* giant echo of the mark, like the blurred backdrops in the apps */
.echo { position: absolute; width: 1500px; height: 1500px; right: -430px; top: -210px; opacity: .06; filter: blur(14px); transform: rotate(-12deg); }
.echo svg { width: 100%; height: 100%; }

.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 40%, rgba(7, 8, 12, .78) 100%); }
.grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay; }

.center { position: absolute; left: 0; right: 0; top: 268px; display: flex; flex-direction: column; align-items: center; }

/* the tile: launcher app-tile language (glass surface, white hairline, focus glow in the brand colour) */
.tile {
	width: 248px; height: 248px; border-radius: 58px; position: relative;
	background: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04) 55%, rgba(255, 255, 255, .02));
	box-shadow: 0 0 0 2px rgba(255, 255, 255, .16) inset, 0 40px 90px rgba(0, 0, 0, .55), 0 0 120px var(--ring);
	display: flex; align-items: center; justify-content: center;
}
.tile::after {
	content: ''; position: absolute; inset: -9px; border-radius: 66px;
	border: 3px solid rgba(255, 255, 255, .9); opacity: .9;
	box-shadow: 0 0 36px var(--ring), 0 0 2px #fff inset;
}
.mark { width: 140px; height: 140px; }
.mark svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .45)); }

h1 { margin-top: 76px; font-size: 68px; font-weight: 300; letter-spacing: -.5px; }
.pill {
	margin-top: 30px; display: flex; align-items: center; gap: 14px;
	padding: 11px 24px 11px 20px; border-radius: 999px; background: rgba(255, 255, 255, .08);
	font-size: 20px; font-weight: 600; letter-spacing: 3.2px; color: var(--faint); text-transform: uppercase;
}
.pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); display: block; }
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>
<div class="echo" id="echo"></div>
<div class="vignette"></div>
<svg class="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="center">
	<div class="tile"><div class="mark" id="mark"></div></div>
	<h1 id="title"></h1>
	<div class="pill"><i></i><span id="label">Starting</span></div>
</div>
<script>
// Brand marks, all drawn as vectors so they stay sharp at splash size.
const MARKS = {
	jfnative: `<svg viewBox="0 0 100 100"><defs><linearGradient id="jf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bfff"/><stop offset="1" stop-color="#8f7dff"/></linearGradient></defs><path d="M36 22.5c0-5.4 5.9-8.7 10.5-5.9l38 24.2c4.3 2.7 4.3 9 0 11.7l-38 24.2C41.9 79.5 36 76.2 36 70.8z" fill="url(#jf)" transform="translate(-19 -18) scale(1.3)"/></svg>`,
	youtube: `<svg viewBox="0 0 56 56"><rect x="2" y="10" width="52" height="36" rx="11" fill="#ff0033"/><path d="M23 20v16l14-8z" fill="#fff"/></svg>`,
	twitch: `<svg viewBox="0 0 24 24"><path fill="#a970ff" d="M2.149 0L.537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612l-3.582 3.582H12l-3.045 3.045v-3.045H4.119V2.149h17.194v11.463z"/><path fill="#a970ff" d="M15.045 6.269h2.149v6.262h-2.149zm-5.731 0h2.149v6.262H9.314z"/></svg>`,
	moonlight: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#5b6470"/><circle cx="50" cy="50" r="35" fill="#fff"/><g stroke="#5b6470" stroke-width="4" stroke-linecap="round">${[0, 45, 90, 135].map(a => `<line x1="50" y1="16" x2="50" y2="84" transform="rotate(${a} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="5" fill="#5b6470"/></svg>`,
	homebrew: `<svg viewBox="0 0 100 100"><path d="M22 18c6 3 12 3 18 0s12-3 18 0 9 3 12 1v58a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M70 34h6a10 10 0 0 1 10 10v8a10 10 0 0 1-10 10h-6" fill="none" stroke="#fff" stroke-width="7"/><circle cx="36" cy="40" r="5" fill="#f28ab7"/><circle cx="52" cy="36" r="4" fill="#fff"/><circle cx="56" cy="52" r="8" fill="#fff"/><circle cx="40" cy="58" r="4" fill="#f28ab7"/><circle cx="46" cy="70" r="6" fill="#f28ab7"/><circle cx="60" cy="68" r="3" fill="#fff"/></svg>`,
	minimalhome: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#f3f5f9" stroke-width="5"/><path d="M50 30v21l13 9" fill="none" stroke="#a99bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
// brand = aurora bottom-left, brand2 = top-right, ring = focus glow
const APPS = {
	jfnative:    {title: 'Jellyfin', brand: '#7b5cff', brand2: '#00a4dc', ring: 'rgba(169, 155, 255, .45)'},
	youtube:     {title: 'YouTube', brand: '#ff0033', brand2: '#a99bff', ring: 'rgba(255, 40, 70, .40)'},
	twitch:      {title: 'Twitch', brand: '#9146ff', brand2: '#ff5ab1', ring: 'rgba(145, 70, 255, .48)'},
	moonlight:   {title: 'Moonlight', brand: '#3a6df0', brand2: '#a99bff', ring: 'rgba(120, 150, 255, .40)'},
	homebrew:    {title: 'Homebrew', brand: '#d1105a', brand2: '#a99bff', ring: 'rgba(230, 60, 130, .42)'},
	minimalhome: {title: 'Minimal Home', brand: '#5a4bd6', brand2: '#a99bff', ring: 'rgba(169, 155, 255, .42)', label: 'Welcome back'},
};
const key = new URLSearchParams(location.search).get('app') || 'jfnative';
const a = APPS[key];
const r = document.documentElement.style;
r.setProperty('--brand', a.brand); r.setProperty('--brand2', a.brand2); r.setProperty('--ring', a.ring);
document.getElementById('mark').innerHTML = MARKS[key];
document.getElementById('echo').innerHTML = MARKS[key];
document.getElementById('title').textContent = a.title;
if (a.label) document.getElementById('label').textContent = a.label;
</script>
</body>
</html>
