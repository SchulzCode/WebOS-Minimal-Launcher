<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Launch splashes for our apps, in the launcher's own language: its background and corner wash, one crisp mark, the
   name set like the launcher's greeting (Inter 30/600). Nothing else - the screen is on for a second or two.
   The cold-boot splash (bootsplash/) draws this same layout natively and animates the clock hands; keep the numbers
   (mark centre 960,484 / 96 px box, wordmark centre y 585) in step with bootsplash/main.c. */
@font-face {
	font-family: 'Inter Variable';
	font-weight: 100 900;
	src: url(../app/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2-variations');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080c; }
body { font-family: 'Inter Variable', sans-serif; color: #f3f5f9; position: relative; }

/* the launcher's .wash (app/src/styles.css) */
.wash {
	position: absolute; inset: 0;
	background:
		radial-gradient(1100px 700px at 12% -8%, rgba(120, 104, 255, 0.16), transparent 70%),
		radial-gradient(900px 600px at 100% 100%, rgba(70, 120, 255, 0.07), transparent 70%);
}
.mark { position: absolute; left: 912px; top: 436px; width: 96px; height: 96px; }
.mark svg { width: 100%; height: 100%; display: block; }
.wm {
	position: absolute; left: 0; right: 0; top: 566px; line-height: 38px; text-align: center;
	font-size: 30px; font-weight: 600; letter-spacing: -0.01em;
}
/* part=wordmark: only the name, white on black - bootsplash/build.sh turns it into the boot splash's text texture */
.only-wordmark, .only-wordmark body { background: #000; }
.only-wordmark .wash, .only-wordmark .mark { display: none; }
.only-wordmark .wm { color: #fff; }
</style>
</head>
<body>
<div class="wash"></div>
<div class="mark" id="mark"></div>
<div class="wm" id="title"></div>
<script>
// Brand marks as vectors, drawn in a 100x100 box.
const MARKS = {
	// clock: ring r44 / 4.2, minute hand (accent) to 12, hour hand towards 4 - bootsplash/main.c draws the same and turns the hands
	minimalhome: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#f3f5f9" stroke-width="4.2"/><path d="M50 50V22" stroke="#a99bff" stroke-width="5" stroke-linecap="round"/><path d="M50 50l14 10" stroke="#f3f5f9" stroke-width="5" stroke-linecap="round"/></svg>`,
	jfnative: `<svg viewBox="0 0 100 100"><defs><linearGradient id="jf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bfff"/><stop offset="1" stop-color="#8f7dff"/></linearGradient></defs><path d="M30 17.5c0-5.8 6.3-9.4 11.3-6.4l44.2 26.5c4.8 2.9 4.8 9.9 0 12.8L41.3 76.9c-5 3-11.3-.6-11.3-6.4z" fill="url(#jf)" transform="translate(-6 6)"/></svg>`,
	youtube: `<svg viewBox="0 0 56 56"><rect x="2" y="10" width="52" height="36" rx="11" fill="#ff0033"/><path d="M23 20v16l14-8z" fill="#fff"/></svg>`,
	twitch: `<svg viewBox="0 0 24 24"><path fill="#a970ff" d="M2.149 0L.537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612l-3.582 3.582H12l-3.045 3.045v-3.045H4.119V2.149h17.194v11.463z"/><path fill="#a970ff" d="M15.045 6.269h2.149v6.262h-2.149zm-5.731 0h2.149v6.262H9.314z"/></svg>`,
	moonlight: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#5b6470"/><circle cx="50" cy="50" r="35" fill="#fff"/><g stroke="#5b6470" stroke-width="4" stroke-linecap="round">${[0, 45, 90, 135].map(a => `<line x1="50" y1="16" x2="50" y2="84" transform="rotate(${a} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="5" fill="#5b6470"/></svg>`,
	homebrew: `<svg viewBox="0 0 100 100"><path d="M22 18c6 3 12 3 18 0s12-3 18 0 9 3 12 1v58a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M70 34h6a10 10 0 0 1 10 10v8a10 10 0 0 1-10 10h-6" fill="none" stroke="#fff" stroke-width="7"/><circle cx="36" cy="40" r="5" fill="#f28ab7"/><circle cx="52" cy="36" r="4" fill="#fff"/><circle cx="56" cy="52" r="8" fill="#fff"/><circle cx="40" cy="58" r="4" fill="#f28ab7"/><circle cx="46" cy="70" r="6" fill="#f28ab7"/><circle cx="60" cy="68" r="3" fill="#fff"/></svg>`,
};
const APPS = {
	jfnative:    {title: 'Jellyfin'},
	youtube:     {title: 'YouTube'},
	twitch:      {title: 'Twitch'},
	moonlight:   {title: 'Moonlight'},
	homebrew:    {title: 'Homebrew'},
	minimalhome: {title: 'Minimal Home'},
	// cold-boot splash (bootsplash/): same picture; the app draws it natively
	bootsplash:  {title: 'Minimal Home', mark: 'minimalhome'},
};
const q = new URLSearchParams(location.search);
const key = q.get('app') || 'jfnative';
const a = APPS[key];
if (q.get('part') === 'wordmark') document.documentElement.className = 'only-wordmark';
document.getElementById('mark').innerHTML = MARKS[a.mark || key];
document.getElementById('title').textContent = a.title;
</script>
</body>
</html>
